<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)"/>
  
  <!-- Construction Building Icon -->
  <g transform="translate(50, 40)">
    <!-- Building Base -->
    <rect x="20" y="60" width="60" height="80" fill="white" opacity="0.95"/>
    
    <!-- Building Windows -->
    <rect x="30" y="75" width="12" height="12" fill="#2563eb" opacity="0.7"/>
    <rect x="48" y="75" width="12" height="12" fill="#2563eb" opacity="0.7"/>
    <rect x="66" y="75" width="12" height="12" fill="#2563eb" opacity="0.7"/>
    <rect x="30" y="95" width="12" height="12" fill="#2563eb" opacity="0.7"/>
    <rect x="48" y="95" width="12" height="12" fill="#2563eb" opacity="0.7"/>
    <rect x="66" y="95" width="12" height="12" fill="#2563eb" opacity="0.7"/>
    
    <!-- Door -->
    <rect x="42" y="110" width="16" height="30" fill="#1e40af"/>
    
    <!-- Roof -->
    <polygon points="10,60 50,30 90,60" fill="#fbbf24"/>
    
    <!-- Crane -->
    <line x1="5" y1="140" x2="5" y2="20" stroke="white" stroke-width="3"/>
    <line x1="5" y1="20" x2="25" y2="20" stroke="white" stroke-width="3"/>
    <line x1="25" y1="20" x2="25" y2="40" stroke="white" stroke-width="2"/>
    <circle cx="25" cy="45" r="5" fill="white"/>
  </g>
  
  <!-- Gear/Operations Icon -->
  <circle cx="100" cy="100" r="25" fill="white" opacity="0.2"/>
  <path d="M 100 80 L 105 85 L 115 80 L 115 90 L 120 95 L 115 105 L 105 105 L 100 110 L 95 105 L 85 105 L 80 95 L 85 90 L 85 80 L 95 85 Z" fill="white" opacity="0.8"/>
</svg>

